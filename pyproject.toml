[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scorecard-pro"
version = "1.0.0"
description = "Bank-grade retail credit scorecard toolkit: WOE/IV binning, logistic scorecard scaled to points, calibration, cut-off economics and fairness audit on UCI German Credit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
